name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  # JS layer: typecheck, unit tests, build, and the npm file list.
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Package contents (dist, native sources, Package.swift; no build output)
        run: |
          npm pack --dry-run --json > pack.json
          node -e "const f=require('./pack.json')[0].files.map(x=>x.path);for(const p of ['dist/index.js','dist/index.d.ts','android/build.gradle','android/src/main/java/dev/strait/capacitor/StraitPlugin.java','ios/Sources/StraitPlugin/StraitPlugin.swift','Package.swift']){if(!f.includes(p)){console.error('missing '+p);process.exit(1)}}if(f.some(p=>p.startsWith('android/build/')||p.startsWith('examples/'))){console.error('build output or examples in the package');process.exit(1)}console.log(f.length+' files ok')"

  # The sample app compiles the Android plugin against the real strait-sdk-android from JitPack.
  sample-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci && npm run build
      - working-directory: examples/capacitor-app
        run: npm ci && npm run build && npx cap sync android
      - working-directory: examples/capacitor-app/android
        run: ./gradlew assembleDebug --no-daemon

  # The sample app compiles the iOS plugin against StraitSDK (Swift Package Manager) for the Simulator.
  sample-ios:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - run: npm ci && npm run build
      - working-directory: examples/capacitor-app
        run: npm ci && npm run build && npx cap sync ios
      - working-directory: examples/capacitor-app/ios/App
        run: |
          xcodebuild -version
          xcodebuild -project App.xcodeproj -scheme App -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' -derivedDataPath ../DerivedData \
            -packageAuthorizationProvider netrc CODE_SIGNING_ALLOWED=NO build | tail -20
